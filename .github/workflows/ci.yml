name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install k3dge
        run: pip install -e ".[dev]"
      - name: Gate check (Full Matrix L0/L1 + L2)
        run: k3dge check --force-full --with-tests
      - name: Tests
        run: pytest -q
