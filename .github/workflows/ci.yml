name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install k3dge
        run: pip install -e ".[dev]"
      - name: Gate check (Full Matrix L0/L1 + L2)
        run: k3dge check --force-full --with-tests
      - name: Doc-gate (README + anchor per docs subdir)
        run: python3 scripts/pre-commit --scan
      - name: Verify commit attestations
        run: |
          base="${{ github.event.before }}"
          head="${{ github.event.after }}"
          if [ -n "$base" ] && [ -n "$head" ] && git rev-list "$base..$head" >/dev/null 2>&1; then
            range="$base..$head"
          elif git rev-list origin/main..HEAD >/dev/null 2>&1; then
            range="origin/main..HEAD"
          else
            range="HEAD~50..HEAD"
          fi
          bad=0
          for h in $(git rev-list "$range"); do
            k3dge verify-attest --commit "$h" || bad=1
          done
          [ "$bad" -eq 0 ]
      - name: Tests
        run: pytest -q
