name: CI

# 三道闸并行，都要绿。一道红不得挡住另一道的日志。
# 不给任何提交类别豁免 attestation：进程 round work / 封版提交必须自己带 k3dge-commit 行
# （engine.attest），与 `k3dge commit` 同一公式。空区间不得当「没什么可验」放行。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install k3dge
        run: pip install -e ".[dev]"
      - name: Gate check (Full Matrix L0/L1 + L2)
        run: k3dge check --force-full --with-tests
      - name: Doc-gate (README + anchor per docs subdir)
        run: python3 scripts/pre-commit --scan

  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install k3dge
        run: pip install -e ".[dev]"
      - name: Verify attestation on every commit in the event range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE:-}" ]; then
            range="${PR_BASE}..${HEAD_SHA}"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && [ -n "${AFTER:-}" ]; then
            range="${BEFORE}..${AFTER}"
          else
            range="${HEAD_SHA}^..${HEAD_SHA}"
          fi
          if [[ "$range" == *..* ]] && git rev-list "$range" >/dev/null 2>&1; then
            commits=$(git rev-list "$range")
          else
            commits=$(git rev-parse "$HEAD_SHA")
          fi
          if [ -z "$commits" ]; then
            echo "attest range '$range' is empty — refusing to skip" >&2
            exit 1
          fi
          echo "verifying commits in $range:"
          echo "$commits"
          bad=0
          for h in $commits; do
            k3dge verify-attest --commit "$h" || bad=1
          done
          test "$bad" -eq 0

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install k3dge
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
