[project.urls]
Repository = "https://github.com/jamieplus/k3dge"
Protocols = "https://github.com/jamieplus/k3dge/tree/main/docs/protocols"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k3dge"
version = "0.1.14"
description = "Spec-gate harness: deterministic contract drift detection for vibecoding agents"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
contract = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-c>=0.21",
]
mcp = ["mcp>=1.0,<3", "tomli>=2; python_version < '3.11'"]
dev = ["pytest>=8", "pre-commit>=3", "mcp>=1.0,<3", "tomli>=2; python_version < '3.11'"]

[project.scripts]
k3dge = "k3dge.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k3dge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
