# k3dge protocol dispatch registry — task_type -> protocol markdown
#
# Deterministic "operation spec" mapping. An upstream agent (Codex / OpenCode /
# Claude Code / DSH) MUST pull the protocol for the task it is about to perform
# before acting, e.g. `k3dge protocol resolve <type>` or MCP `protocol://<type>`.
# This is the "worker reads the machine's operation spec first" discipline:
# fixed flow + fixed protocol = bounded attention = fewer accidents.
#
# A missing target file is flagged by `k3dge check` (PROTOCOL_REGISTRY_INVALID),
# so the registry stays physically consistent with disk (no 404 dangling refs).

[protocols]
audit     = "docs/protocols/audit_default.md"
verify    = "docs/protocols/verify_default.md"
incident  = "docs/protocols/incident_default.md"
task      = "docs/protocols/task_default.md"
protocol  = "docs/protocols/meta_protocol.md"

[settings]
# task_type used when an agent calls without an explicit type
default = "audit"

# Path routing: the agent hands the target file path to `k3dge protocol resolve
# --path <file>` BEFORE writing; the most-specific glob decides which protocol to
# load. No match => proceed under base spec (protocols augment, never replace).
# Add a path line only after its protocol key exists in [protocols] above.
[paths]
"docs/reviews/**"     = "audit"
"tests/**"            = "verify"
"docs/incidents/**"   = "incident"
"docs/tasks/**"       = "task"
"docs/protocols/**"   = "protocol"
