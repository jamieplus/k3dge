# 硬闸契约（ADR-0001 §2 第 8 条）：声明式阈值/开关；执行器在 engine。
# 缺省值在 src/k3dge/engine/gates.py 的 DEFAULTS；此处只列本仓覆盖（可删，删则用缺省）。
# 契约只承载数据，不含逻辑/表达式；坏配置回落缺省，闸不因配置失效。

[audit_trigger]
c2_nesting_max = 5
volume_max = 8

# 编排单元：preconditions（闸 id，全绿才继续）+ actions（动作 id）。
# seal 消费这组闸；执行器读契约跑（ADR-0001 §2 第 8 条）。
[checks.seal]
preconditions = ["tasks_all_done", "align_pass", "guides_filled", "adrs_all_accepted", "adr_landed"]
actions = ["full_matrix", "archive", "closure_note", "prune"]
